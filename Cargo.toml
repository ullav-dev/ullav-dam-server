[package]
name = "ullav-dam-server"
version = "26.1.1"
edition = "2021"

[[bin]]
name = "ullav-dam-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
postgres-types = { version = "0.2", features = ["derive", "with-uuid-1", "with-chrono-0_4"] }

# S3 / MinIO
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Bounded LRU cache for thumbnails
lru = "0.12"

# Config & env
dotenvy = "0.15"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Multipart / bytes
bytes = "1"

# OpenAPI
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# MIME type inference
mime_guess = "2"

# JWT validation
jsonwebtoken = "9"

# HTTP client (auth proxy)
reqwest = { version = "0.12", features = ["json"] }

# Image processing for thumbnails
image = "0.25"

# PDF thumbnail rendering (pdfium-render wraps Google's PDFium; Apache 2.0)
pdfium-render = { version = "0.8", features = ["image"] }

# Temp files for Office → PDF conversion
tempfile = "3"

# ZIP extraction for Apple iWork thumbnail extraction (Pages, Numbers, Keynote)
zip = { version = "2", default-features = false, features = ["deflate"] }

# EXIF metadata extraction (pure Rust)
kamadak-exif = "0.5"

# JPEG/PNG/WebP segment access for IPTC and XMP extraction
img-parts = "0.3"

# XMP XML parsing
roxmltree = "0.20"

[profile.release]
opt-level = 3
lto = true
